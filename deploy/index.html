<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title data-i18n="title"></title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/apexcharts/dist/apexcharts.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
    <script src="https://unpkg.com/i18next/i18next.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="dark-mode">

<header class="header-container">
    <div class="header-left">
        <h1 class="header-title" data-i18n="title"></h1>
        <p class="header-subtitle" data-i18n="subtitle"></p>
        <p class="header-description" data-i18n="description"></p>

        <div class="header-updates">
            <strong class="update-label" data-i18n="updated-daily-label"></strong>
            <span class="update-description" data-i18n="updated-daily-description"></span>
        </div>
    </div>

    <div class="header-right">
        <button id="dark-mode-toggle" class="toggle-button" onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>
        <button id="language-toggle" class="toggle-button" onclick="toggleLanguage()">
            🌍 DE
        </button>
    </div>
</header>

<nav class="top-nav">
    <div class="controls-buttons">
        <input type="checkbox" id="toggle-overview" checked onclick="toggleSubpage('overview-page', this.checked)" />
        <label for="toggle-overview" data-i18n="nav-overview">Overview</label>

        <input type="checkbox" id="toggle-forecasts" checked onclick="toggleSubpage('individual-forecasts', this.checked)" />
        <label for="toggle-forecasts" data-i18n="nav-forecasts">Per-TSO Forecasts</label>

        <input type="checkbox" id="toggle-api_info" onclick="toggleSubpage('api-info', this.checked)" />
        <label for="toggle-api_info">API</label>
    </div>
</nav>

<div class="subpages-container">

    <!-- ========== OVERVIEW ========== -->
    <div id="overview-page" class="subpage active">
        <div id="main_info-content"></div>

        <h2 data-i18n="national-summary-title" style="margin: 20px 0 5px 0;">National DE/LU Forecast Summary</h2>
        <p style="color: gray; font-size: 13px; margin: 0 0 10px 0;" data-i18n="national-summary-desc">
            7-day forecasts for the German/Luxembourg bidding zone, updated daily from weather data.
        </p>
        <div id="national-summary-chart" style="min-height: 350px;"></div>
        <div id="national-summary-error" class="error-message"></div>
    </div>

    <!-- ========== PER-TSO FORECASTS ========== -->
    <div id="individual-forecasts" class="subpage active">
        <section class="forecast-intro">
            <p data-i18n="forecast-intro"></p>
        </section>
    </div>

    <!-- ========== API ========== -->
    <div id="api-info" class="subpage">
        <div id="api_info-content"></div>
    </div>

</div>

<footer style="text-align: center; padding: 20px; font-size: 12px; color: gray; border-top: 1px solid #444; margin-top: 30px;">
    Fork of <a href="https://github.com/vsevolodnedora/energy_market_analysis" target="_blank">vsevolodnedora/energy_market_analysis</a>
    by <a href="https://github.com/vsevolodnedora" target="_blank">Vsevolod Nedora</a>.
    All original domain knowledge, feature engineering, and pipeline design from the upstream project.
</footer>

<script src="script.js"></script>

<script>
    function toggleSubpage(subpageId, isChecked) {
      const subpage = document.getElementById(subpageId);
      if (!subpage) return;
      if (isChecked) {
        subpage.classList.add('active');
      } else {
        subpage.classList.remove('active');
      }
    }
</script>

</body>
</html>
