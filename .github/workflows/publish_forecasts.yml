name: Publish Forecasts

on:
  workflow_run:
    workflows:
      - Update Forecasts # The name of the first workflow
    types:
      - completed
  workflow_dispatch:
      
jobs:
  update_forecasts:
    # Gate: only run if the upstream Update Forecasts run succeeded (or on manual dispatch).
    # Prevents silent redeployment of stale data when forecasting is broken.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.5'
          cache: 'pipenv'

      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python

      - name: Install Dependencies
        run: pipenv install

      - name: Export national DE/LU forecasts
        run: pipenv run python export_national_forecasts.py || echo "export_national_forecasts.py failed (non-critical)"

      - name: Publish Forecasts (website data)
        run: pipenv run python publish_data.py DE all || echo "publish_data.py failed (non-critical)"

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./deploy/data/*
          git commit -m "Update served data" || echo "No changes to commit"
          n=0
          until [ $n -ge 3 ]; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            n=$((n+1))
            echo "Push attempt $n failed; retrying in 30s..."
            sleep 30
          done
          echo "All push attempts failed"
          exit 1