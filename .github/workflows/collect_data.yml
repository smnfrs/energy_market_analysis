name: Update Database

on:
#  push:
#    branches: ["main"]
#    paths:
#      - 'data/**'
  schedule:
    - cron: '0 7 * * *'  # runs every day at 07:00 UTC
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LOG_LEVEL: WARNING
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.5'
          cache: 'pipenv'

      - name: Install pipenv
        run: curl https://raw.githubusercontent.com/pypa/pipenv/master/get-pipenv.py | python

      - name: Install Dependencies
        run: pipenv install

      - name: Update SMARD v2 Data
        run: pipenv run python update_database.py DE update_smard_v2 hourly

      - name: Update OpenMeteo Offshore Windfarms Data
        continue-on-error: true
        run: pipenv run python update_database.py DE update_openmeteo_windfarms_offshore hourly

      - name: Update OpenMeteo Onshore Windfarms Data
        continue-on-error: true
        run: pipenv run python update_database.py DE update_openmeteo_windfarms_onshore hourly

      - name: Update OpenMeteo Solarfarms Data
        continue-on-error: true
        run: pipenv run python update_database.py DE update_openmeteo_solarfarms hourly

      - name: Update OpenMeteo Cities Data
        continue-on-error: true
        run: pipenv run python update_database.py DE update_openmeteo_cities hourly

      - name: Commit Updated Data
        run: |
          git config --global user.name 'Collector'
          git config --global user.email 'noreply@nedora.digital'
          git add database/
          git commit -m "Add data for today" || echo "No changes to commit"
          n=0
          until [ $n -ge 3 ]; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            n=$((n+1))
            echo "Push attempt $n failed; retrying in 30s..."
            sleep 30
          done
          echo "All push attempts failed"
          exit 1
